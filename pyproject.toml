[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nigrani"
version = "1.0.0"
description = "Predictive maintenance for factory machinery — deterministic health index, degradation rate and remaining useful life."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abrar Baloch" }]
keywords = ["predictive-maintenance", "iot", "manufacturing", "fastapi", "reliability"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic[email]>=2.7,<3.0",
  "bcrypt>=4.1,<5.0",
  "pyjwt>=2.8,<3.0",
  "slowapi>=0.1.9,<1.0",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.5,<1.0",
  "black>=24.0,<25.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.black]
line-length = 110
target-version = ["py311"]
