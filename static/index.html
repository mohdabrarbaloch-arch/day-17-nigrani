<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nigrani — Predictive Maintenance Control Plane</title>
<meta name="description" content="Nigrani watches factory machinery, predicts failure, and opens work orders automatically. Every score is traceable." />
<meta name="theme-color" content="#0a0e14" />
<link rel="stylesheet" href="/static/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a0e14'/><path d='M22 68 L38 34 L50 56 L62 34 L78 68' stroke='%2334d399' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
</head>
<body>

<!-- ── Auth gate ─────────────────────────────────────────────────────── -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <svg viewBox="0 0 100 100" class="brand-mark" aria-hidden="true">
        <path d="M22 68 L38 34 L50 56 L62 34 L78 68" stroke="currentColor" stroke-width="9"
              fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>Nigrani</h1>
        <p class="brand-sub">نگہبانی · predictive maintenance</p>
      </div>
    </div>

    <div class="auth-tabs" role="tablist">
      <button class="auth-tab is-active" data-tab="login" role="tab">Sign in</button>
      <button class="auth-tab" data-tab="register" role="tab">Create account</button>
    </div>

    <form id="login-form" class="auth-form">
      <label>Email<input type="email" name="email" autocomplete="username" required /></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required /></label>
      <button type="submit" class="btn btn-primary">Sign in</button>
      <p class="auth-hint">Demo: <code>admin@nigrani.dev</code> / <code>ChangeMe123!</code></p>
    </form>

    <form id="register-form" class="auth-form is-hidden">
      <label>Full name<input type="text" name="full_name" autocomplete="name" required minlength="2" /></label>
      <label>Email<input type="email" name="email" autocomplete="username" required /></label>
      <label>Password<input type="password" name="password" autocomplete="new-password" required minlength="8" /></label>
      <button type="submit" class="btn btn-primary">Create account</button>
    </form>

    <p id="auth-error" class="auth-error" role="alert"></p>
  </div>
</div>

<!-- ── App shell ─────────────────────────────────────────────────────── -->
<div id="app" class="app is-hidden">
  <header class="topbar">
    <div class="topbar-left">
      <svg viewBox="0 0 100 100" class="brand-mark sm" aria-hidden="true">
        <path d="M22 68 L38 34 L50 56 L62 34 L78 68" stroke="currentColor" stroke-width="9"
              fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="topbar-title">Nigrani</span>
      <span class="pill pill-live"><i></i>live</span>
    </div>
    <div class="topbar-right">
      <span id="user-name" class="user-name"></span>
      <button id="logout-btn" class="btn btn-ghost btn-sm">Sign out</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-view="dashboard">Dashboard</button>
    <button class="tab" data-view="machines">Machines</button>
    <button class="tab" data-view="alerts">Alerts</button>
    <button class="tab" data-view="orders">Work orders</button>
    <button class="tab" data-view="automation">Automation</button>
  </nav>

  <main class="main">

    <!-- Dashboard -->
    <section id="view-dashboard" class="view">
      <div class="kpi-grid" id="kpi-grid"></div>

      <div class="panel-grid">
        <div class="panel">
          <div class="panel-head">
            <h2>Fleet health</h2>
            <span class="panel-note">lowest first</span>
          </div>
          <div id="worst-list" class="worst-list"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Automation feed</h2>
            <span class="panel-note">last 10 actions</span>
          </div>
          <div id="automation-feed" class="feed"></div>
        </div>
      </div>
    </section>

    <!-- Machines -->
    <section id="view-machines" class="view is-hidden">
      <div class="panel">
        <div class="panel-head">
          <h2>Machines</h2>
          <button id="add-machine-btn" class="btn btn-primary btn-sm">+ Add machine</button>
        </div>
        <div id="machine-list" class="machine-list"></div>
      </div>

      <div class="panel is-hidden" id="machine-detail-panel">
        <div class="panel-head">
          <h2 id="detail-title">Machine</h2>
          <button id="close-detail" class="btn btn-ghost btn-sm">Close</button>
        </div>
        <div id="machine-detail" class="machine-detail"></div>
        <div class="panel-head sub">
          <h3>Send a reading</h3>
        </div>
        <form id="reading-form" class="reading-form">
          <label>Vibration (mm/s RMS)<input type="number" step="0.1" name="vibration_rms" value="3.2" required /></label>
          <label>Temperature (°C)<input type="number" step="0.1" name="temperature_c" value="64" required /></label>
          <label>Current (A)<input type="number" step="0.1" name="current_a" value="10.2" required /></label>
          <label>Runtime (h)<input type="number" step="1" name="runtime_hours" value="4200" required /></label>
          <button type="submit" class="btn btn-primary">Ingest &amp; score</button>
        </form>
        <div id="reading-result" class="reading-result"></div>
      </div>
    </section>

    <!-- Alerts -->
    <section id="view-alerts" class="view is-hidden">
      <div class="panel">
        <div class="panel-head">
          <h2>Alerts</h2>
          <div class="filters">
            <select id="alert-severity-filter">
              <option value="">All severities</option>
              <option value="critical">Critical</option>
              <option value="warning">Warning</option>
            </select>
          </div>
        </div>
        <div id="alert-list" class="alert-list"></div>
      </div>
    </section>

    <!-- Work orders -->
    <section id="view-orders" class="view is-hidden">
      <div class="panel">
        <div class="panel-head">
          <h2>Work orders</h2>
          <div class="filters">
            <select id="order-status-filter">
              <option value="">All statuses</option>
              <option value="open">Open</option>
              <option value="assigned">Assigned</option>
              <option value="in_progress">In progress</option>
              <option value="done">Done</option>
            </select>
          </div>
        </div>
        <div id="order-list" class="order-list"></div>
      </div>
    </section>

    <!-- Automation -->
    <section id="view-automation" class="view is-hidden">
      <div class="panel">
        <div class="panel-head">
          <h2>Automation log</h2>
          <span class="panel-note">every automated decision, written down</span>
        </div>
        <div id="automation-table" class="automation-table"></div>
      </div>
    </section>

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<!-- Add machine modal -->
<div id="modal" class="modal is-hidden">
  <div class="modal-card">
    <div class="panel-head">
      <h2>Add machine</h2>
      <button id="modal-close" class="btn btn-ghost btn-sm">✕</button>
    </div>
    <form id="machine-form" class="reading-form">
      <label>Plant
        <select name="plant_id" id="plant-select" required></select>
      </label>
      <label>Name<input type="text" name="name" placeholder="Cooling water pump 2" required /></label>
      <label>Asset tag<input type="text" name="asset_tag" placeholder="KHI-PMP-014" required /></label>
      <label>Type
        <select name="machine_type">
          <option value="pump">Pump</option>
          <option value="compressor">Compressor</option>
          <option value="motor">Motor</option>
          <option value="conveyor">Conveyor</option>
          <option value="chiller">Chiller</option>
        </select>
      </label>
      <label>Power class
        <select name="power_class">
          <option value="1">1 — small (&lt;15 kW)</option>
          <option value="2" selected>2 — medium (15–75 kW)</option>
          <option value="3">3 — large (&gt;75 kW)</option>
        </select>
      </label>
      <label>Baseline vibration<input type="number" step="0.1" name="baseline_vibration" value="2.8" /></label>
      <label>Baseline temp (°C)<input type="number" step="0.1" name="baseline_temperature" value="62" /></label>
      <label>Baseline current (A)<input type="number" step="0.1" name="baseline_current" value="10" /></label>
      <button type="submit" class="btn btn-primary">Create machine</button>
    </form>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
